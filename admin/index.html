<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin — Palis Paint Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
<link rel="icon" type="image/png" href="../images/palis-logo.png">
</head>
<body>

<div id="login" class="login hidden">
  <form id="loginForm" class="login-card" autocomplete="off">
    <img src="../images/palis-logo.png" alt="" class="login-logo">
    <div class="eyebrow">Admin Panel</div>
    <h1>Palis Paint Center</h1>
    <label>Username<input id="loginUser" required autofocus></label>
    <label>Password<input id="loginPass" type="password" required></label>
    <div id="loginError" class="form-error" role="alert"></div>
    <button class="btn btn-gold" type="submit">Sign in</button>
    <a class="back-link" href="../index.html">← Back to website</a>
  </form>
</div>

<div id="app" class="app hidden">
  <aside id="sidebar" class="sidebar">
    <div class="brand">
      <div class="brand-name">palis</div>
      <div class="brand-sub">PAINT CENTER / ADMIN</div>
    </div>
    <nav id="nav"></nav>    
    <div class="side-foot">
      <div class="side-label">STORE WORKSPACE</div>
      <div class="side-user"><span class="avatar" id="avatar">A</span><span>Hi, <b id="whoami">admin</b>!</span></div>
      <a class="side-link" href="../index.html" target="_blank" rel="noopener">View website ↗</a>
      <button id="logoutBtn" class="side-link" type="button">Logout</button>
    </div>
  </aside>
  <div id="scrim" class="scrim"></div>

  <div class="main">
    <header class="topbar">
      <button id="menuBtn" class="icon-btn menu-btn" aria-label="Menu" type="button">☰</button>
      <h2 id="pageTitle">Dashboard</h2>
    </header>
    <main id="view" class="view"></main>
  </div>
</div>

<dialog id="modal" class="modal"></dialog>
<div id="toast" class="toast" role="status"></div>

<script src="../js/store.js"></script>
<script src="admin.js"></script>
</body>
</html>
