<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Palis Paint Center — San Nicolas, Pangasinan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/png" href="images/palis-logo.png">
</head>
<body>

  <div class="swatch-strip">
    <span style="background:#c23b2c"></span>
    <span style="background:#e2a638"></span>
    <span style="background:#2f7566"></span>
    <span style="background:#2f4f7a"></span>
    <span style="background:#7a3f6b"></span>
    <span style="background:#cbb23a"></span>
  </div>

  <!-- Each mount point below is filled at runtime with the matching file from /sections -->
  <div id="header-mount"></div>

  <main>
    <div id="hero-mount"></div>
    <div id="products-mount"></div>
    <div id="mixing-mount"></div>
    <div id="contracting-mount"></div>
    <div id="about-mount"></div>
    <div id="contact-mount"></div>
  </main>

  <div id="footer-mount"></div>

  <script src="js/main.js"></script>
</body>
</html>
